name: Build SimpleMemo HAP
on:
  workflow_dispatch:
    inputs:
      cli_url:
        description: 'Official Linux x64 Command Line Tools 26.0.0 ZIP URL'
        required: true
        type: string
      cli_sha256:
        description: 'SHA256 from the official download page'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare matching official toolchain
        env:
          CLI_URL: ${{ inputs.cli_url }}
          CLI_SHA256: ${{ inputs.cli_sha256 }}
        run: bash scripts/setup-ci.sh
      - name: Build unsigned HAP
        shell: bash
        run: |
          set -euo pipefail
          ohpm install --all
          hvigorw --mode module -p product=default -p module=entry@default -p buildMode=debug assembleHap --no-daemon
      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMemo-unsigned-HAP
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: error
          retention-days: 7
